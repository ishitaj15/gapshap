version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: gapshap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gapshap
      POSTGRES_PASSWORD: gapshap_secret
      POSTGRES_DB: gapshap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapshap"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  
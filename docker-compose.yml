services:
  postgres:
    image: postgres:16
    container_name: gapshap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gapshap
      POSTGRES_PASSWORD: gapshap_secret
      POSTGRES_DB: gapshap
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
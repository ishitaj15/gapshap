services:
  postgres:
    image: postgres:16
    container_name: gapshap_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gapshap
      POSTGRES_PASSWORD: gapshap_secret
      POSTGRES_DB: gapshap
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  cpp-server:
    build:
      context: ./cpp-server
      dockerfile: Dockerfile
    container_name: gapshap_cpp
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gapshap
      DB_USER: gapshap
      DB_PASSWORD: gapshap_secret

volumes:
  postgres_data: